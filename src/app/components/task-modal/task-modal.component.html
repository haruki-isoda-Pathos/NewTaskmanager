<div class="modal-overlay">
    <div class="modal">
  
      <h2>タスクを編集、削除</h2>

      <div class="form-group">
        <label>タスク名(50字まで)※必須</label>
        <textarea 
        [(ngModel)]="title" 
        name="title" 
        placeholder="タスク名" 
        (input)="onInputLimit($event, 50, 'title')"
        maxlength="50" 
        required></textarea>
  
        <div class="char-count">
          {{ title?.length || 0 }} / 50
        </div>
      </div>
    
      <div class="form-group">
        <label>メモ(200字まで)</label>
        <textarea
        [(ngModel)]="memo" 
        name="memo" 
        placeholder="メモ" 
        (input)="onInputLimit($event, 200, 'memo')"
        maxlength="200"></textarea>
  
        <div class="char-count">
          {{ memo?.length || 0 }} / 200
        </div>
      </div>
    
      <div class="form-group">
        <label>期限 ※必須</label>
        <input
          type="datetime-local"
          [(ngModel)]="deadline"
          name="deadline">
      </div>
    
      <div class="form-group">
        <label>アラーム</label>
        <select [(ngModel)]="notifyAfterMinutes" name="notifyAfterMinutes">
          <option [ngValue]="null">なし</option>
          <option [ngValue]="10">いまから10分後</option>
          <option [ngValue]="30">いまから30分後</option>
          <option [ngValue]="60">いまから1時間後</option>
          <option [ngValue]="180">いまから3時間後</option>
          <option [ngValue]="360">いまから6時間後</option>
          <option [ngValue]="720">いまから12時間後</option>
          <option [ngValue]="1440">いまから1日後</option>
          <option [ngValue]="2880">いまから2日後</option>
        </select>
      </div>
  
      <div class="form-group">
        <label>期限前リマインド</label>
        <select [(ngModel)]="notifyBefore" name="notifyBefore" [disabled]="!deadline">
          <option [ngValue]="null">なし</option>
          <option [ngValue]="30">30分前に通知</option>
          <option [ngValue]="60">60分前に通知</option>
          <option [ngValue]="120">2時間前に通知</option>
          <option [ngValue]="120">3時間前に通知</option>
          <option [ngValue]="300">5時間前に通知</option>
          <option [ngValue]="720">12時間前に通知</option>
          <option [ngValue]="1440">1日前に通知</option>
          <option [ngValue]="4320">3日前に通知</option>
        </select>
      </div>
  
      <div class="form-group">
        <label>優先順位</label>
        <select [(ngModel)]="priority" name="priority" >
          <option [ngValue]="3">高</option>
          <option [ngValue]="2">中</option>
          <option [ngValue]="1">低</option>
        </select>
      </div>
     
      <!-- ...中略（入力フォーム部分）... -->

<div class="button-group">
    <div class="main-actions">
      <button type="button" class="btn-cancel" (click)="modalClose.emit()">
        キャンセル
      </button>
      <button type="button" class="btn-save" (click)="saveTask()">
        保存する
      </button>
    </div>
    
    <button type="button" class="btn-delete" (click)="removeTask()">
      タスクを削除する
    </button>
  </div>
 </div>
</div>

<div *ngIf="showRemoveConfirm" class="modal-overlay2">
    <div class="modal2">
      <p>
        本当に削除しますか？
      </p>
      <div class="button-group">
      <button class="btn-delete2" (click)="remove.emit(task)">削除</button>
      <button class="btn-cancel" (click)="cancelRemove()">キャンセル</button>
      </div>
    </div>  
</div>
